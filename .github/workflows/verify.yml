name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp clean verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp clean verify
      - name: Smoke test packaged Spring Boot app
        run: python .github/scripts/smoke.py
      - name: Verify live Auto.ru parser without bypassing access restrictions
        if: runner.os == 'Linux'
        run: python .github/scripts/live_probe.py
      - name: Upload live parser diagnostics
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: live-parser-diagnostics
          path: |
            target/live-source-probe.json
            target/live-probe-application.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser integration tests
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
          node .github/scripts/browser-smoke.cjs
      - name: Build Windows app with bundled Java
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Smoke test Windows portable app without system Java
        if: runner.os == 'Windows'
        shell: pwsh
        run: python .github/scripts/portable_smoke.py
      - name: Upload Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AutoWatcher-Windows-x64
          path: target/AutoWatcher-Windows-x64.zip
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.os }}
          path: target/browser/
          if-no-files-found: ignore
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: ignore
  source-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe public access and robots rules
        run: python .github/scripts/source_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-access
          path: source-probe.json
