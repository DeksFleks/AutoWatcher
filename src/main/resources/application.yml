server:
  address: 127.0.0.1
  port: ${AUTOWATCHER_PORT:8080}

spring:
  application:
    name: autowatcher
  datasource:
    url: jdbc:sqlite:${AUTOWATCHER_DB:./data/autowatcher.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA busy_timeout=5000
  flyway:
    enabled: true
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  monitoring:
    enabled: false
